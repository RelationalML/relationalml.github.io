      thesis: "On the Challenges in Training Sparse Neural Networks From Scratch"
      description: "I work on building provable algorithms for deep learning and am currently interested in algorithms related to sparsity in neural nets. Specifically I am interested in the Lottery Ticket Hypothesis and how it can help identify the underlying structure of a learnt network. I completed my Master's from the Electrical and Computer Engineering Department at Carnegie Mellon University."
      next: RSDE 2 at Microsoft Research

