layout: default

<div id="homeid" class="col-sm-8">

  <!-- carousel -->
  <div id="carousel" class="carousel slide" data-interval="false" data-ride="carousel" style="margin: auto; width: 100%;">
    <ol class="carousel-indicators">
        <li data-target="#carousel" data-slide-to="0" class="active"></li>
        <li data-target="#carousel" data-slide-to="1"></li>
        <li data-target="#carousel" data-slide-to="2"></li>
        <li data-target="#carousel" data-slide-to="3"></li>
    </ol>
    <div class="carousel-inner">
        <div class="item active">
          <img src="{{ site.url }}{{ site.baseurl }}/images/group/4.jpg"  alt="31-03-2026"
          style="width: 100%; border-radius: 40px; margin-left: auto;">
        </div>
        <div class="item">
          <img src="{{ site.url }}{{ site.baseurl }}/images/group/2.jpg"  alt="03-10-2024"
          style="width: 100%; border-radius: 40px; margin-left: auto;">
        </div>
        <div class="item">
          <img src="{{ site.url }}{{ site.baseurl }}/images/group/3.jpeg"  alt="18-06-2025"
          style="width: 100%; border-radius: 40px; margin-left: auto;">
        </div>
        <div class="item">
          <img src="{{ site.url }}{{ site.baseurl }}/images/group/1.jpg" alt="21-10-2023"
          style="width: 100%; border-radius: 40px; margin-left: auto;">
        </div>
    </div>
  <a class="left carousel-control" href="#carousel" role="button" data-slide="prev">
    <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="right carousel-control" href="#carousel" role="button" data-slide="next">
    <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </a>
</div>

{{ content }}
